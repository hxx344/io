# Entropy only: spread gate -> random LEG2 market entry -> timed LEG4 reduce-only exit.
cycle:
  direction: random            # fixed: independently random long/short each cycle
  cycles: 0                    # 0 = repeat until stopped
  max_spread_bps: 2.0           # (ask - bid) / mid * 10000 <= this threshold
  close_delay_ms: 50.0          # from the filled LEG2 attempt's submission
  state_file: logs/cycle.json

entropy:
  dex: io
  taker_fee_bps: 0.0            # informational; no fee/premium signal gate
  max_position_usd: 1000.0
  max_orders_per_min: 120

sizing:
  quantity: 0.0                # >0 fixed base quantity; 0 uses order_notional_usd
  order_notional_usd: 50.0
  max_order_notional_usd: 500.0
  min_order_notional_usd: 10.0

execution:
  cooldown_sec: 2.0
  settle_timeout_sec: 5.0
  leg2_slippage_bps: 20.0       # entry market slippage cap; 20 bps = 0.20%
  leg4_slippage_bps: 20.0       # exit market slippage cap; same protection across retries
  max_order_attempts: 3
  retry_delay_sec: 1.0
  rate_limit_pause_sec: 10.0
  staleness_sec: 10.0
  http_keepalive_sec: 10.0

recorder:
  enabled: true
  csv: logs/minutes.csv

logging:
  level: INFO
  status_interval_sec: 30.0
  account_refresh_sec: 10.0    # read-only balance, fills/fees, funding and unrealized PnL
  trades_csv: logs/legs.csv
  dashboard: true
  file: logs/engine.log
